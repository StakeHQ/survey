<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Survey · Better loans for the team</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1b2a41;
    --paper:#fafaf8;
    --card:#ffffff;
    --green:#0e7a5f;
    --green-soft:#e6f2ee;
    --line:#e4e2dc;
    --muted:#6b7280;
    --gold:#c89b3c;
    --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto}
    *,*::before,*::after{animation:none!important;transition:none!important}
  }
  body{
    font-family:'Manrope',system-ui,-apple-system,sans-serif;
    background:var(--paper);
    color:var(--ink);
    line-height:1.55;
    font-size:16px;
    -webkit-font-smoothing:antialiased;
  }
  .progress-wrap{
    position:sticky;top:0;z-index:10;
    background:var(--paper);
    border-bottom:1px solid var(--line);
  }
  .progress-inner{
    max-width:640px;margin:0 auto;padding:10px 20px;
    display:flex;align-items:center;gap:12px;
  }
  .progress-track{
    flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden;
  }
  .progress-fill{
    height:100%;width:0%;background:var(--green);border-radius:3px;
    transition:width .35s ease;
  }
  .progress-label{
    font-size:12px;font-weight:700;color:var(--muted);
    min-width:34px;text-align:right;font-variant-numeric:tabular-nums;
  }
  .lang-toggle{
    display:flex;gap:2px;background:var(--line);border-radius:9px;padding:2px;
  }
  .lang-toggle button{
    border:none;background:transparent;cursor:pointer;
    font:inherit;font-size:12px;font-weight:700;color:var(--muted);
    padding:4px 9px;border-radius:7px;
  }
  .lang-toggle button.active{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
  .lang-toggle button:focus-visible{outline:3px solid rgba(14,122,95,.35)}
  main{max-width:640px;margin:0 auto;padding:36px 20px 80px}
  .eyebrow{
    display:inline-block;font-size:12px;font-weight:700;letter-spacing:.12em;
    text-transform:uppercase;color:var(--green);margin-bottom:10px;
  }
  h1{
    font-family:'Fraunces',Georgia,serif;font-weight:600;
    font-size:clamp(26px,5.5vw,34px);line-height:1.2;margin-bottom:14px;
  }
  .intro{color:var(--ink);margin-bottom:8px}
  .confidential{
    background:var(--green-soft);border-left:3px solid var(--green);
    border-radius:0 10px 10px 0;
    padding:12px 16px;margin:18px 0 8px;font-size:14.5px;
  }
  .section-head{
    margin:44px 0 6px;
    display:flex;align-items:baseline;gap:10px;
  }
  .section-head .num{
    font-family:'Fraunces',Georgia,serif;font-size:15px;color:var(--gold);font-weight:600;
  }
  .section-head .name{
    font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
  }
  .section-rule{height:1px;background:var(--line);margin-bottom:22px}
  fieldset{border:none;margin:0 0 30px}
  legend{
    font-weight:700;font-size:17px;line-height:1.4;margin-bottom:4px;padding:0;
  }
  .hint{font-size:14px;color:var(--muted);margin-bottom:12px}
  legend + .options, legend + .hint + .options{margin-top:12px}
  .options{display:grid;gap:9px}
  .opt{
    position:relative;display:block;cursor:pointer;
    background:var(--card);border:1.5px solid var(--line);border-radius:var(--radius);
    padding:13px 16px 13px 46px;font-size:15.5px;
    transition:border-color .15s ease, background .15s ease;
    user-select:none;
  }
  .opt:hover{border-color:#c9c6bd}
  .opt input{position:absolute;opacity:0;pointer-events:none}
  .opt .mark{
    position:absolute;left:15px;top:50%;transform:translateY(-50%);
    width:19px;height:19px;border-radius:50%;
    border:2px solid #b9b6ad;background:#fff;
    transition:border-color .15s ease, background .15s ease;
  }
  .opt input[type="checkbox"] + .mark{border-radius:6px}
  .opt .mark::after{
    content:"";position:absolute;inset:0;margin:auto;
    width:9px;height:9px;border-radius:50%;background:#fff;
    transform:scale(0);transition:transform .15s ease;
  }
  .opt input[type="checkbox"] + .mark::after{
    width:10px;height:10px;border-radius:2px;
    background:no-repeat center/contain url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>');
  }
  .opt input:checked ~ .mark{border-color:var(--green);background:var(--green)}
  .opt input:checked ~ .mark::after{transform:scale(1)}
  .opt:has(input:checked){border-color:var(--green);background:var(--green-soft)}
  .opt input:focus-visible ~ .mark{outline:3px solid rgba(14,122,95,.35);outline-offset:2px}
  .branch{
    display:none;
    margin:-12px 0 30px;
    padding:18px 18px 6px;
    border-left:3px solid var(--green-soft);
  }
  .branch.visible{display:block}
  .offer{
    background:var(--card);border:1.5px solid var(--line);border-radius:var(--radius);
    padding:20px 22px;margin:0 0 26px;
  }
  .offer p{font-size:15.5px}
  .offer p + p{margin-top:12px}
  .offer strong{color:var(--green)}
  input[type="text"], input[type="email"], textarea{
    width:100%;background:var(--card);border:1.5px solid var(--line);
    border-radius:var(--radius);padding:13px 16px;font:inherit;font-size:15.5px;color:var(--ink);
  }
  input[type="text"]:focus, input[type="email"]:focus, textarea:focus{outline:3px solid rgba(14,122,95,.25);border-color:var(--green)}
  textarea{min-height:96px;resize:vertical}
  .amount-label{font-weight:700;font-size:15px;margin:16px 0 10px}
  .two-col{display:grid;gap:16px}
  @media (min-width:520px){.two-col{grid-template-columns:1fr 1fr}}
  .error{
    display:none;color:#b3261e;font-size:14px;font-weight:600;margin-top:8px;
  }
  fieldset.invalid .error{display:block}
  fieldset.invalid legend{color:#b3261e}
  .submit-row{margin-top:36px}
  button[type="submit"]{
    width:100%;background:var(--green);color:#fff;border:none;cursor:pointer;
    font:inherit;font-weight:700;font-size:16.5px;
    padding:16px;border-radius:var(--radius);
    transition:background .15s ease, transform .1s ease;
  }
  button[type="submit"]:hover{background:#0b6a52}
  button[type="submit"]:active{transform:scale(.99)}
  button[type="submit"]:disabled{background:#9db8b0;cursor:default}
  button[type="submit"]:focus-visible{outline:3px solid rgba(14,122,95,.35);outline-offset:2px}
  .fineprint{font-size:13px;color:var(--muted);text-align:center;margin-top:14px}
  .success{display:none;text-align:center;padding:70px 10px}
  .success.visible{display:block}
  .success .check{
    width:64px;height:64px;margin:0 auto 22px;border-radius:50%;
    background:var(--green);
    display:flex;align-items:center;justify-content:center;
  }
  .success .check svg{width:30px;height:30px}
  .success h2{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:26px;margin-bottom:10px}
  .success p{color:var(--muted);max-width:400px;margin:0 auto}
  .hp{position:absolute;left:-9999px;top:-9999px;height:0;overflow:hidden}
</style>
</head>
<body>

<div class="progress-wrap" id="progressWrap">
  <div class="progress-inner">
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-label" id="progressLabel">0%</div>
    <div class="lang-toggle" role="group" aria-label="Language / Idioma">
      <button type="button" id="btnEn" class="active">EN</button>
      <button type="button" id="btnEs">ES</button>
      <button type="button" id="btnPt">PT</button>
    </div>
  </div>
</div>

<main>
  <div id="formView">
    <span class="eyebrow" id="eyebrow"></span>
    <h1 data-i18n="h1"></h1>
    <p class="intro" data-i18n="intro"></p>
    <div class="confidential" data-i18n-html="confid"></div>

    <form id="survey" novalidate>
      <!-- honeypot -->
      <div class="hp" aria-hidden="true">
        <label>Leave this empty<input type="text" name="website" tabindex="-1" autocomplete="off"></label>
      </div>

      <div class="section-head"><span class="num">I</span><span class="name" data-i18n="s1"></span></div>
      <div class="section-rule"></div>

      <fieldset data-required data-name="country">
        <legend data-i18n="q_country"></legend>
        <div class="options">
          <label class="opt"><input type="radio" name="country" value="Brazil"><span class="mark"></span><span data-i18n="co1"></span></label>
          <label class="opt"><input type="radio" name="country" value="Colombia"><span class="mark"></span><span data-i18n="co2"></span></label>
          <label class="opt"><input type="radio" name="country" value="Mexico"><span class="mark"></span><span data-i18n="co3"></span></label>
          <label class="opt"><input type="radio" name="country" value="Argentina"><span class="mark"></span><span data-i18n="co4"></span></label>
          <label class="opt"><input type="radio" name="country" value="Dominican Republic"><span class="mark"></span><span data-i18n="co5"></span></label>
          <label class="opt"><input type="radio" name="country" value="Other"><span class="mark"></span><span data-i18n="co6"></span></label>
        </div>
        <p class="error" data-i18n="err_select"></p>
      </fieldset>


      <div class="section-head"><span class="num">II</span><span class="name" data-i18n="s2"></span></div>
      <div class="section-rule"></div>

      <fieldset data-required data-name="credit_applied">
        <legend data-i18n="q_loanapp"></legend>
        <p class="hint" data-i18n="hint_loanapp"></p>
        <div class="options">
          <label class="opt"><input type="radio" name="credit_applied" value="Applied and got it"><span class="mark"></span><span data-i18n="cr1"></span></label>
          <label class="opt"><input type="radio" name="credit_applied" value="Applied but denied"><span class="mark"></span><span data-i18n="cr2"></span></label>
          <label class="opt"><input type="radio" name="credit_applied" value="Needed it but didn't apply"><span class="mark"></span><span data-i18n="cr4"></span></label>
          <label class="opt"><input type="radio" name="credit_applied" value="Didn't need it"><span class="mark"></span><span data-i18n="cr3"></span></label>
        </div>
        <p class="error" data-i18n="err_select"></p>
      </fieldset>

      <div class="branch" id="loanBranch">
        <fieldset data-name="interest_rate" data-branch-required>
          <legend data-i18n="q_rate"></legend>
          <p class="hint" data-i18n="hint_rate"></p>
          <div class="options">
            <label class="opt"><input type="radio" name="interest_rate" value="Under 15%"><span class="mark"></span><span data-i18n="r1"></span></label>
            <label class="opt"><input type="radio" name="interest_rate" value="15-20%"><span class="mark"></span><span data-i18n="r2"></span></label>
            <label class="opt"><input type="radio" name="interest_rate" value="20-30%"><span class="mark"></span><span data-i18n="r3"></span></label>
            <label class="opt"><input type="radio" name="interest_rate" value="Over 30%"><span class="mark"></span><span data-i18n="r4"></span></label>
            <label class="opt"><input type="radio" name="interest_rate" value="Not sure"><span class="mark"></span><span data-i18n="r5"></span></label>
          </div>
          <p class="error" data-i18n="err_select"></p>
        </fieldset>


      </div>

      <fieldset data-required data-name="usd_income_barrier">
        <legend data-i18n="q_barrier"></legend>
        <p class="hint" data-i18n="hint_barrier"></p>
        <div class="options">
          <label class="opt"><input type="radio" name="usd_income_barrier" value="Yes, often"><span class="mark"></span><span data-i18n="b1"></span></label>
          <label class="opt"><input type="radio" name="usd_income_barrier" value="Yes, once or twice"><span class="mark"></span><span data-i18n="b2"></span></label>
          <label class="opt"><input type="radio" name="usd_income_barrier" value="No"><span class="mark"></span><span data-i18n="b3"></span></label>
          <label class="opt"><input type="radio" name="usd_income_barrier" value="I don't have this problem"><span class="mark"></span><span data-i18n="b5"></span></label>
          <label class="opt"><input type="radio" name="usd_income_barrier" value="Never tried"><span class="mark"></span><span data-i18n="b4"></span></label>
        </div>
        <p class="error" data-i18n="err_select"></p>
      </fieldset>

      <fieldset data-required data-name="employer_advance">
        <legend data-i18n="q_advance"></legend>
        <div class="options">
          <label class="opt"><input type="radio" name="employer_advance" value="Yes, and I received it"><span class="mark"></span><span data-i18n="ad1"></span></label>
          <label class="opt"><input type="radio" name="employer_advance" value="Yes, but it wasn't available"><span class="mark"></span><span data-i18n="ad2"></span></label>
          <label class="opt"><input type="radio" name="employer_advance" value="No, but I've thought about it"><span class="mark"></span><span data-i18n="ad3"></span></label>
          <label class="opt"><input type="radio" name="employer_advance" value="No, never needed to"><span class="mark"></span><span data-i18n="ad4"></span></label>
        </div>
        <p class="error" data-i18n="err_select"></p>
      </fieldset>

      <div class="section-head"><span class="num">III</span><span class="name" data-i18n="s3"></span></div>
      <div class="section-rule"></div>

      <div class="offer">
        <p data-i18n-html="offer1"></p>
        <p data-i18n-html="offer2"></p>
      </div>

      <fieldset data-required data-name="interest_level">
        <legend data-i18n="q_interest"></legend>
        <div class="options">
          <label class="opt"><input type="radio" name="interest_level" value="Would use ASAP"><span class="mark"></span><span data-i18n="i1"></span></label>
          <label class="opt"><input type="radio" name="interest_level" value="Within a year"><span class="mark"></span><span data-i18n="i2"></span></label>
          <label class="opt"><input type="radio" name="interest_level" value="Maybe someday"><span class="mark"></span><span data-i18n="i3"></span></label>
          <label class="opt"><input type="radio" name="interest_level" value="Not interested"><span class="mark"></span><span data-i18n="i4"></span></label>
        </div>
        <p class="error" data-i18n="err_select"></p>
      </fieldset>

      <fieldset data-required data-name="loan_amount">
        <legend data-i18n="q_amount"></legend>
        <p class="hint" data-i18n="hint_amount"></p>
        <div class="options">
          <label class="opt"><input type="radio" name="loan_amount" value="Under $5,000"><span class="mark"></span><span data-i18n="a1"></span></label>
          <label class="opt"><input type="radio" name="loan_amount" value="$5,000-$10,000"><span class="mark"></span><span data-i18n="a2"></span></label>
          <label class="opt"><input type="radio" name="loan_amount" value="$10,000-$20,000"><span class="mark"></span><span data-i18n="a3"></span></label>
          <label class="opt"><input type="radio" name="loan_amount" value="Over $20,000"><span class="mark"></span><span data-i18n="a4"></span></label>
          <label class="opt"><input type="radio" name="loan_amount" value="Wouldn't borrow"><span class="mark"></span><span data-i18n="a5"></span></label>
        </div>
        <p class="error" data-i18n="err_select"></p>
      </fieldset>

      <fieldset data-name="loan_purpose">
        <legend data-i18n="q_purpose"></legend>
        <p class="hint" data-i18n="hint_purpose"></p>
        <div class="options">
          <label class="opt"><input type="checkbox" name="loan_purpose" value="Refinance debt"><span class="mark"></span><span data-i18n="p1"></span></label>
          <label class="opt"><input type="checkbox" name="loan_purpose" value="Car"><span class="mark"></span><span data-i18n="p2"></span></label>
          <label class="opt"><input type="checkbox" name="loan_purpose" value="Home/property"><span class="mark"></span><span data-i18n="p3"></span></label>
          <label class="opt"><input type="checkbox" name="loan_purpose" value="Family expense"><span class="mark"></span><span data-i18n="p4"></span></label>
          <label class="opt"><input type="checkbox" name="loan_purpose" value="Education"><span class="mark"></span><span data-i18n="p5"></span></label>
          <label class="opt"><input type="checkbox" name="loan_purpose" value="Business/investment"><span class="mark"></span><span data-i18n="p6"></span></label>
          <label class="opt"><input type="checkbox" name="loan_purpose" value="Other"><span class="mark"></span><span data-i18n="p7"></span></label>
        </div>
      </fieldset>


      <fieldset data-required data-name="auto_deduction">
        <legend data-i18n="q_deduct"></legend>
        <div class="options">
          <label class="opt"><input type="radio" name="auto_deduction" value="Prefer it"><span class="mark"></span><span data-i18n="d1"></span></label>
          <label class="opt"><input type="radio" name="auto_deduction" value="Fine with it"><span class="mark"></span><span data-i18n="d2"></span></label>
          <label class="opt"><input type="radio" name="auto_deduction" value="Somewhat uncomfortable"><span class="mark"></span><span data-i18n="d3"></span></label>
          <label class="opt"><input type="radio" name="auto_deduction" value="Would not accept"><span class="mark"></span><span data-i18n="d4"></span></label>
        </div>
        <p class="error" data-i18n="err_select"></p>
      </fieldset>


      <div class="section-head"><span class="num">IV</span><span class="name" data-i18n="s4"></span></div>
      <div class="section-rule"></div>

      <div class="offer">
        <p data-i18n-html="reveal1"></p>
        <p data-i18n-html="reveal2"></p>
      </div>

      <fieldset data-required data-name="stablecoin_familiarity">
        <legend data-i18n="q_fam"></legend>
        <div class="options">
          <label class="opt"><input type="radio" name="stablecoin_familiarity" value="Already use them"><span class="mark"></span><span data-i18n="fa1"></span></label>
          <label class="opt"><input type="radio" name="stablecoin_familiarity" value="Heard of them, never used"><span class="mark"></span><span data-i18n="fa2"></span></label>
          <label class="opt"><input type="radio" name="stablecoin_familiarity" value="Not familiar"><span class="mark"></span><span data-i18n="fa3"></span></label>
        </div>
        <p class="error" data-i18n="err_select"></p>
      </fieldset>

      <fieldset data-required data-name="switch_willingness">
        <legend data-i18n="q_switch"></legend>
        <p class="hint" data-i18n="hint_switch"></p>
        <div class="options">
          <label class="opt"><input type="radio" name="switch_willingness" value="Yes, for the lower rate"><span class="mark"></span><span data-i18n="sw1"></span></label>
          <label class="opt"><input type="radio" name="switch_willingness" value="Yes, and I'd want it even without a loan"><span class="mark"></span><span data-i18n="sw2"></span></label>
          <label class="opt"><input type="radio" name="switch_willingness" value="Maybe, I'd want to understand it better"><span class="mark"></span><span data-i18n="sw3"></span></label>
          <label class="opt"><input type="radio" name="switch_willingness" value="No"><span class="mark"></span><span data-i18n="sw4"></span></label>
        </div>
        <p class="error" data-i18n="err_select"></p>
      </fieldset>

      <fieldset data-required data-name="interest_level_post">
        <legend data-i18n="q_interest2"></legend>
        <p class="hint" data-i18n="hint_interest2"></p>
        <div class="options">
          <label class="opt"><input type="radio" name="interest_level_post" value="Would use ASAP"><span class="mark"></span><span data-i18n="i1"></span></label>
          <label class="opt"><input type="radio" name="interest_level_post" value="Within a year"><span class="mark"></span><span data-i18n="i2"></span></label>
          <label class="opt"><input type="radio" name="interest_level_post" value="Maybe someday"><span class="mark"></span><span data-i18n="i3"></span></label>
          <label class="opt"><input type="radio" name="interest_level_post" value="Not interested"><span class="mark"></span><span data-i18n="i4"></span></label>
        </div>
        <p class="error" data-i18n="err_select"></p>
      </fieldset>

      <div class="section-head"><span class="num">V</span><span class="name" data-i18n="s5"></span></div>
      <div class="section-rule"></div>

      <fieldset data-required data-name="pilot_optin">
        <legend data-i18n="q_pilot"></legend>
        <div class="options">
          <label class="opt"><input type="radio" name="pilot_optin" value="Yes"><span class="mark"></span><span data-i18n="pl_yes"></span></label>
          <label class="opt"><input type="radio" name="pilot_optin" value="No"><span class="mark"></span><span data-i18n="pl_no"></span></label>
        </div>
        <p class="error" data-i18n="err_select"></p>
      </fieldset>

      <!-- Contact details only appear for people who asked to be contacted.
           Everyone else stays anonymous, which is what the intro promises. -->
      <div class="branch" id="contactBranch">
        <p class="hint" data-i18n="hint_contact"></p>
        <div class="two-col">
          <fieldset data-name="name" data-branch-required>
            <legend data-i18n="q_name"></legend>
            <input type="text" name="name" autocomplete="name" data-i18n-ph="ph_name">
            <p class="error" data-i18n="err_name"></p>
          </fieldset>

          <fieldset data-name="email" data-branch-required data-validate="email">
            <legend data-i18n="q_email"></legend>
            <input type="email" name="email" autocomplete="email" inputmode="email" data-i18n-ph="ph_email">
            <p class="error" data-i18n="err_email"></p>
          </fieldset>
        </div>
      </div>

      <fieldset data-name="comments">
        <legend data-i18n="q_comments"></legend>
        <p class="hint" data-i18n="hint_comments"></p>
        <textarea name="comments" data-i18n-ph="ph_comments"></textarea>
      </fieldset>

      <div class="submit-row">
        <button type="submit" id="submitBtn" data-i18n="submit"></button>
        <p class="fineprint" data-i18n="fineprint"></p>
      </div>
    </form>
  </div>

  <div class="success" id="successView">
    <div class="check">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
    </div>

    });
    document.querySelectorAll('[data-i18n-html]').forEach(function(el){
      el.innerHTML = t(el.getAttribute('data-i18n-html'));
    });
    document.querySelectorAll('[data-i18n-ph]').forEach(function(el){

    });
    document.getElementById('eyebrow').textContent = t('eyebrow').replace('{c}', company);
    if (!submitBtn.disabled) submitBtn.textContent = t('submit');
    Object.keys(langButtons).forEach(function(k){
      langButtons[k].classList.toggle('active', lang === k);
    });
  }
  Object.keys(langButtons).forEach(function(k){
    langButtons[k].addEventListener('click', function(){ lang = k; applyLang(); });
  });

  function branchVisible(el){ return el.classList.contains('visible'); }

  function requiredFieldsets(){
    var list = Array.prototype.slice.call(form.querySelectorAll('fieldset[data-required]'));

      if (branchVisible(b)) {
        list = list.concat(Array.prototype.slice.call(b.querySelectorAll('fieldset[data-branch-required]')));
      }
    });
    return list;
  }

  function fieldsetAnswered(fs){
    if (fs.hasAttribute('data-multi')) {
      return fs.querySelectorAll('input[type="checkbox"]:checked').length > 0;
    }
    var radios = fs.querySelectorAll('input[type="radio"]');
    if (radios.length) {
      for (var i=0;i<radios.length;i++){ if (radios[i].checked) return true; }
      return false;
    }
    var text = fs.querySelector('input[type="text"], input[type="email"], textarea');
    if (text) {
      if (!text.value.trim()) return false;
      if (fs.getAttribute('data-validate') === 'email') {
        return /^\S+@\S+\.\S+$/.test(text.value.trim());
      }
      return true;
    }
    return true;
  }

  function updateProgress(){
    var fsets = requiredFieldsets();
    var done = fsets.filter(fieldsetAnswered).length;
    var pct = fsets.length ? Math.round(done / fsets.length * 100) : 0;
    progressFill.style.width = pct + '%';
    progressLabel.textContent = pct + '%';
  }

    branch.classList.toggle('visible', show);

      toggleBranch(loanBranch, el.value === 'Applied and got it');
    }
    if (el.name === 'pilot_optin') {
      toggleBranch(contactBranch, el.value === 'Yes');
    }
    var fs = el.closest('fieldset');
    if (fs) fs.classList.remove('invalid');
    updateProgress();
  });
  form.addEventListener('input', function(e){
    var fs = e.target.closest('fieldset');
    if (fs) fs.classList.remove('invalid');
    updateProgress();
  });

  form.addEventListener('submit', function(e){
    e.preventDefault();

    // honeypot: silently accept
    if (form.website && form.website.value) { showSuccess(); return; }

    var fsets = requiredFieldsets();
    var firstInvalid = null;
    fsets.forEach(function(fs){
      var ok = fieldsetAnswered(fs);
      fs.classList.toggle('invalid', !ok);
      if (!ok && !firstInvalid) firstInvalid = fs;
    });
    if (firstInvalid) {
      firstInvalid.scrollIntoView({behavior:'smooth', block:'center'});
      return;
    }

    var fd = new FormData(form);
    var params = new URLSearchParams();
    var multi = {};
    MULTI_FIELDS.forEach(function(k){ multi[k] = []; });
    fd.forEach(function(value, key){
      if (key === 'website') return;
      if (MULTI_FIELDS.indexOf(key) !== -1) { multi[key].push(value); return; }
      params.append(key, value);
    });
    MULTI_FIELDS.forEach(function(k){ params.append(k, multi[k].join('; ')); });
    if (!branchVisible(loanBranch)) { params.set('interest_rate',''); }
    if (!branchVisible(contactBranch)) { params.set('name',''); params.set('email',''); }
    params.append('language', lang);
    params.append('company', company);

    submitBtn.disabled = true;
    submitBtn.textContent = t('sending');

    if (SCRIPT_URL.indexOf('PASTE_YOUR') === 0) {
      alert(t('alert_config'));
      submitBtn.disabled = false;
      submitBtn.textContent = t('submit');
      return;
    }

    // mode:'cors' (not 'no-cors'): Apps Script returns Access-Control-Allow-Origin: *
    // on both the 302 and the final response, so we can read the real result and
    // show an error instead of faking success when the save failed.
    fetch(SCRIPT_URL, {
      method: 'POST',
      mode: 'cors',
      headers: {'Content-Type': 'application/x-www-form-urlencoded'},
      body: params.toString()
    }).then(function(res){
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    }).then(function(data){
      if (!data || !data.ok) throw new Error((data && data.error) || 'server error');
      showSuccess();
    }).catch(function(){
      submitBtn.disabled = false;
      submitBtn.textContent = t('submit');
      alert(t('alert_fail'));
    });
  });

  function showSuccess(){
    document.getElementById('formView').style.display = 'none';
    document.querySelector('.progress-wrap').style.display = 'none';
    document.getElementById('successView').classList.add('visible');
    window.scrollTo({top:0});
  }

  applyLang();
  updateProgress();
})();
</script>
</body>
</html>
